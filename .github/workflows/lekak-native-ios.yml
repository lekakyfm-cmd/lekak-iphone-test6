name: Lekak - native iPhone modules
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lekak-native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-modules:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify inputs and object platform checks
        run: |
          mkdir -p build/logs
          python tools/test_ios_object_format.py
          python -c 'import sys; sys.path.insert(0,"tools"); from test_lekak_sdk import verify_sources; verify_sources()'
          test -f SourceMod/Lekak/native-units.json
      - uses: actions/cache@v4
        with:
          path: |
            EngineSDK/tmp/pc/llvm-macos
            EngineSDK/tmp/pc/tools/macos
            EngineSDK/tmp/pc/macos-deps
            EngineSDK/tmp/pc/guest-compiler
          key: lekak-macos-arm64-v1-${{ hashFiles('EngineSDK/tools/pc/macos_toolchain.json', 'EngineSDK/tools/pc/macos_deps.py', 'EngineSDK/tools/pc/dependency_archives.py', 'EngineSDK/tools/pc/fetch_tools.py', 'EngineSDK/tools/pc/llvm/guest_ir.cpp') }}
      - name: Compile complete engine and its ABI metadata
        run: |
          set -o pipefail
          python EngineSDK/tools/pc/build_arm64.py --jobs 3 --build "$PWD/build/game-abi" 2>&1 | tee build/logs/game-build.log
      - name: Compile static Lekak modules for a physical iPhone
        run: |
          set -o pipefail
          python tools/build_lekak_ios_objects.py --game-build build/game-abi --output build/lekak-ios 2>&1 | tee build/logs/lekak-ios.log
      - name: Upload reports even when compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lekak-iPhone-native-compile-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/logs/
            build/game-abi/logs/
            build/game-abi/summary.json
            build/game-abi/exports.txt
            build/game-abi/mod_signatures.json
            build/lekak-ios/build-report.json
            build/lekak-ios/libLekak_iPhone.a
